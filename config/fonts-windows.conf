<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Windows-emulated sessions only: Windows font files, no Linux fonts. -->
<fontconfig>
  <dir>/opt/nya/winfonts</dir>
  <cachedir>/var/cache/fontconfig</cachedir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <config>
    <rescan><int>0</int></rescan>
  </config>

  <!-- Names Windows resolves through GDI aliases or variable-font instances. -->
  <match target="scan">
    <test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="append"><string>Times</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Courier New</string></test>
    <edit name="family" mode="append"><string>Courier</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Sitka Text</string></test>
    <edit name="family" mode="append">
      <string>Sitka Small</string>
      <string>Sitka Subheading</string>
      <string>Sitka Heading</string>
      <string>Sitka Display</string>
      <string>Sitka Banner</string>
    </edit>
  </match>

  <!-- Typographic names DirectWrite does not expose as families. -->
  <match target="scan">
    <test name="family"><string>Segoe UI Semilight</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="scan">
    <test name="family"><string>Malgun Gothic Semilight</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="scan">
    <test name="family"><string>맑은 고딕 Semilight</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="scan">
    <test name="family"><string>Leelawadee UI Semilight</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="scan">
    <test name="family"><string>Nirmala UI Semilight</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="scan">
    <test name="family"><string>Nirmala Text Semilight</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="scan">
    <test name="family"><string>Yu Gothic UI Semilight</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="scan">
    <test name="family"><string>Sitka</string></test>
    <edit name="family" mode="delete"/>
  </match>
  <match target="scan">
    <test name="family"><string>Segoe UI Variable</string></test>
    <edit name="family" mode="assign">
      <string>Segoe UI Variable Text</string>
      <string>Segoe UI Variable Small</string>
      <string>Segoe UI Variable Display</string>
    </edit>
  </match>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Arial</family>
      <family>Microsoft YaHei</family>
      <family>Segoe UI</family>
      <family>Segoe UI Emoji</family>
      <family>Segoe UI Symbol</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Times New Roman</family>
      <family>SimSun</family>
      <family>Segoe UI Emoji</family>
      <family>Segoe UI Symbol</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Consolas</family>
      <family>NSimSun</family>
      <family>Segoe UI Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer><family>Segoe UI Emoji</family></prefer>
  </alias>

  <!-- Blink asks for emoji presentation with lang und-Zsye. -->
  <match target="pattern">
    <test name="lang"><string>und-zsye</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Segoe UI Emoji</string></edit>
  </match>

  <!-- Glyph fallback by language, like DirectWrite's system fallback. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="append"><string>Yu Gothic</string><string>MS Gothic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="append"><string>Malgun Gothic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="append"><string>Microsoft JhengHei</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <edit name="family" mode="append"><string>Microsoft JhengHei</string></edit>
  </match>
  <match target="pattern">
    <edit name="family" mode="append">
      <string>Microsoft YaHei</string>
      <string>Segoe UI Symbol</string>
      <string>Segoe UI Emoji</string>
      <string>Segoe UI Historic</string>
      <string>Nirmala UI</string>
      <string>Ebrima</string>
      <string>Leelawadee UI</string>
      <string>Gadugi</string>
      <string>Myanmar Text</string>
      <string>Javanese Text</string>
      <string>Mongolian Baiti</string>
      <string>Microsoft Himalaya</string>
      <string>Microsoft Yi Baiti</string>
      <string>Sylfaen</string>
      <string>SimSun-ExtB</string>
      <string>SimSun-ExtG</string>
    </edit>
  </match>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
