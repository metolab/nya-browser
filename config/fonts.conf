<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Liberation Sans</family>
      <family>DejaVu Sans</family>
      <family>WenQuanYi Micro Hei</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif CJK TC</family>
      <family>Noto Serif CJK JP</family>
      <family>Noto Serif CJK KR</family>
      <family>Liberation Serif</family>
      <family>DejaVu Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono CJK SC</family>
      <family>Liberation Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>WenQuanYi Micro Hei Mono</family>
    </prefer>
  </alias>

  <!-- Append Windows family names onto real files so Blink's exact-family lookup succeeds. -->
  <match target="scan">
    <test name="family"><string>Liberation Sans</string></test>
    <edit name="family" mode="append">
      <string>Segoe UI</string>
      <string>Segoe UI Light</string>
      <string>Segoe UI Semibold</string>
      <string>Segoe UI Historic</string>
      <string>Segoe UI Symbol</string>
      <string>Segoe UI Variable</string>
      <string>Segoe Print</string>
      <string>Segoe Script</string>
      <string>Tahoma</string>
      <string>Verdana</string>
      <string>Trebuchet MS</string>
      <string>Comic Sans MS</string>
      <string>Impact</string>
      <string>Arial</string>
      <string>Arial Black</string>
      <string>Arial Narrow</string>
      <string>Microsoft Sans Serif</string>
      <string>Lucida Sans Unicode</string>
      <string>Franklin Gothic Medium</string>
      <string>Candara</string>
      <string>Corbel</string>
      <string>Gadugi</string>
      <string>Ebrima</string>
      <string>Nirmala UI</string>
      <string>Leelawadee UI</string>
      <string>MV Boli</string>
      <string>Marlett</string>
      <string>Ink Free</string>
      <string>Aptos</string>
      <string>Aptos Display</string>
      <string>Aptos Narrow</string>
    </edit>
  </match>
  <match target="scan">
    <test name="family"><string>Liberation Serif</string></test>
    <edit name="family" mode="append">
      <string>Times</string>
      <string>Times New Roman</string>
      <string>Georgia</string>
      <string>Palatino Linotype</string>
      <string>Constantia</string>
      <string>Sitka Text</string>
      <string>Sitka Display</string>
      <string>Sitka Heading</string>
      <string>Sitka Banner</string>
      <string>Sitka Small</string>
      <string>Sitka Subheading</string>
      <string>Sylfaen</string>
      <string>Gabriola</string>
      <string>Symbol</string>
    </edit>
  </match>
  <match target="scan">
    <test name="family"><string>Liberation Mono</string></test>
    <edit name="family" mode="append">
      <string>Courier</string>
      <string>Courier New</string>
      <string>Consolas</string>
      <string>Lucida Console</string>
      <string>Cascadia Code</string>
      <string>Cascadia Mono</string>
    </edit>
  </match>
  <match target="scan">
    <test name="family"><string>Carlito</string></test>
    <edit name="family" mode="append">
      <string>Calibri</string>
      <string>Calibri Light</string>
    </edit>
  </match>
  <match target="scan">
    <test name="family"><string>Caladea</string></test>
    <edit name="family" mode="append">
      <string>Cambria</string>
      <string>Cambria Math</string>
    </edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Sans CJK SC</string></test>
    <edit name="family" mode="append">
      <string>Microsoft YaHei</string>
      <string>Microsoft YaHei UI</string>
      <string>SimHei</string>
      <string>Javanese Text</string>
      <string>Myanmar Text</string>
      <string>Microsoft Himalaya</string>
      <string>Microsoft New Tai Lue</string>
      <string>Microsoft PhagsPa</string>
      <string>Microsoft Tai Le</string>
      <string>Microsoft Yi Baiti</string>
      <string>Microsoft Uighur</string>
      <string>Mongolian Baiti</string>
      <string>Urdu Typesetting</string>
    </edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Serif CJK SC</string></test>
    <edit name="family" mode="append">
      <string>SimSun</string>
      <string>NSimSun</string>
      <string>MingLiU-ExtB</string>
      <string>SimSun-ExtB</string>
    </edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Sans CJK TC</string></test>
    <edit name="family" mode="append">
      <string>Microsoft JhengHei</string>
      <string>Microsoft JhengHei UI</string>
    </edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Sans CJK JP</string></test>
    <edit name="family" mode="append">
      <string>Yu Gothic</string>
      <string>Yu Gothic UI</string>
      <string>Yu Gothic Light</string>
      <string>MS Gothic</string>
      <string>MS PGothic</string>
      <string>MS UI Gothic</string>
    </edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Sans CJK KR</string></test>
    <edit name="family" mode="append">
      <string>Malgun Gothic</string>
      <string>Malgun Gothic Semilight</string>
    </edit>
  </match>
  <match target="scan">
    <test name="family"><string>Noto Color Emoji</string></test>
    <edit name="family" mode="append">
      <string>Segoe UI Emoji</string>
      <string>Segoe MDL2 Assets</string>
      <string>Segoe Fluent Icons</string>
      <string>HoloLens MDL2 Assets</string>
      <string>Webdings</string>
      <string>Wingdings</string>
    </edit>
  </match>
</fontconfig>
