# NVIDIA GPU overlay. Use with the production compose file:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Requires nvidia-container-toolkit on the host. Chromium still presents
# through Xvfb; GL/WebGL is rendered on the GPU via ANGLE.

services:
  nya-browser:
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      NYA_GPU: "1"
      NYA_GPU_BACKEND: ${NYA_GPU_BACKEND:-vulkan}
    devices:
      - /dev/dri
