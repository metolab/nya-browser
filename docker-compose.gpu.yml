# NVIDIA GPU overlay. Use with the production compose file:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Requires nvidia-container-toolkit on the host. GL/WebGL rasterize on the
# GPU via ANGLE gl-egl. Present to Xvfb is EGL readback + X PutImage:
# Xvfb has no NVIDIA eglCreateWindowSurface configs.
# The nvidia runtime is required so NVIDIA EGL/GL libraries are injected;
# compose `gpus: all` alone only exposes the device for compute.

services:
  nya-browser:
    runtime: nvidia
    pid: host
    gpus: all
    cap_add:
      # Read /proc/<pid>/fd and maps so GPU use can be attributed when
      # nvidia-smi reports host PIDs or stale process list entries.
      - SYS_PTRACE
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      NYA_GPU: "1"
      NYA_GPU_BACKEND: ${NYA_GPU_BACKEND:-gl-egl}
      NYA_VNC_NOXDAMAGE: "1"
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
      __GLX_VENDOR_LIBRARY_NAME: nvidia
    devices:
      - /dev/dri
    volumes:
      # nvidia-smi inside the container often reports host PIDs; map them
      # back to the container namespace for per-session GPU stats.
      - /proc:/host/proc:ro
