name: nya-browser

# Production: pull the published image. Local builds belong in docker-compose.dev.yml.
#   docker compose up -d
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# NVIDIA hosts must also load docker-compose.gpu.yml, otherwise the container
# has no /dev/nvidia* and no nvidia-smi (GPU stats and hardware GL both fail):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
#   docker compose up -d

services:
  nya-browser:
    image: ghcr.io/metolab/nya-browser:${NYA_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: nya-browser
    env_file:
      - .env
    ports:
      - "${NYA_PORT:-8080}:8080"
    volumes:
      - ${NYA_DATA_DIR:-./data}:/data
    shm_size: "2gb"
    cap_add:
      - NET_ADMIN
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
