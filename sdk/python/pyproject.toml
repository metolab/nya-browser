[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "nya-browser"
version = "0.1.0"
description = "Python SDK for Nya Browser: manage sessions and proxies, and drive browsers over CDP."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.25",
  "websockets>=13",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
patchright = ["patchright>=1.40"]

[project.scripts]
nya = "nya.cli:main"

[project.urls]
Homepage = "https://github.com/metolab/nya-browser"

[tool.hatch.build.targets.wheel]
packages = ["src/nya"]
